services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: automotive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: automotive_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automotive -d automotive_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://automotive:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/automotive_db
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://automotive:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/automotive_db
      ENVIRONMENT: production
      DEBUG: "false"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      USE_SYNTHETIC_DATA: ${USE_SYNTHETIC_DATA:-true}
      USE_GOOGLE_CSE: ${USE_GOOGLE_CSE:-false}
      EBAY_ENVIRONMENT: ${EBAY_ENVIRONMENT:-PRODUCTION}
      EBAY_MARKETPLACE: ${EBAY_MARKETPLACE:-EBAY_US}
      USE_EBAY_API: ${USE_EBAY_API:-false}
      EBAY_APP_ID: ${EBAY_APP_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
