# Render's free web service sleeps after 15 idle minutes and takes about 40 seconds to wake. This pings it every
# 10 minutes between 07:00 and 22:00 Singapore time (23:00-14:00 UTC), so the workshop never waits for it to wake.
# /health also touches the database, which keeps a free Supabase project from pausing. GitHub may run scheduled
# jobs late, and turns them off after 60 days without commits to the repository; re-enable under Actions if so.
name: Keep the workshop app awake
on:
  schedule:
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-13 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 2 https://yap-workshop.onrender.com/health
